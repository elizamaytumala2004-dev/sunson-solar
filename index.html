<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sunsun Solar - Registration</title>
<link rel="stylesheet" href="eli.css">


</head>

<body>

<div class="sun"></div>

<div class="cloud cloud-left"></div>
<div class="cloud cloud-right"></div>

<div class="bird bird1"></div>
<div class="bird bird2"></div>

<div class="hill hill-back"></div>
<div class="hill hill-middle"></div>
<div class="hill hill-front"></div>

<div class="login-card">

    <div class="logo-sun">
        <span>
            Sunsun<br>
            Solar
        </span>
    </div>

    <h1>Registration</h1>


    <div class="input-group">

        <label for="firstName">
            First Name
        </label>

        <input
            type="text"
            id="firstName"
            placeholder="Enter your first name"
        >

    </div>


    <div class="input-group">

        <label for="middleName">
            Middle Name
        </label>

        <input
            type="text"
            id="middleName"
            placeholder="Enter your middle name"
        >

    </div>


    <div class="input-group">

        <label for="lastName">
            Last Name
        </label>

        <input
            type="text"
            id="lastName"
            placeholder="Enter your last name"
        >

    </div>


    <div class="input-group">

        <label for="contact">
            Contact Number
        </label>

        <input
            type="tel"
            id="contact"
            placeholder="Enter your contact number"
        >

    </div>


    <div class="input-group">

        <label for="email">
            Email Address
        </label>

        <input
            type="email"
            id="email"
            placeholder="Enter your email address"
        >

    </div>


    <div class="input-group">

        <label for="address">
            Address
        </label>

        <input
            type="text"
            id="address"
            placeholder="Enter your complete address"
        >

    </div>


    <div class="input-group">

        <label for="username">
            Username
        </label>

        <input
            type="text"
            id="username"
            placeholder="Create your username"
        >

    </div>


    <div class="input-group">

        <label for="password">
            Password
        </label>

        <input
            type="password"
            id="password"
            placeholder="Create your password"
        >

    </div>


    <div class="input-group">

        <label for="confirmPassword">
            Confirm Password
        </label>

        <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm your password"
        >

    </div>


    <button type="button">
        Register
    </button>


    <div class="forgot">

        <a href="#">
            Already have an account? Login
        </a>

    </div>

</div>
```

</body>

</html>
